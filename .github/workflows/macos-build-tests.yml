name: macOS Build & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: macOS build and CTest
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build
        uses: ./.github/actions/setup-macos-build

      - name: Build application, bundled Python, and tests
        run: cmake --build out/ci/build --parallel 3 2>&1 | tee out/ci/build.log

      - name: Run tests
        id: tests
        run: |
          ctest --test-dir out/ci/build --output-on-failure --no-tests=error \
            --timeout 180 --output-junit "$PWD/out/ci/ctest-results.xml" \
            2>&1 | tee out/ci/ctest.log

      - name: Summarize test results and skips
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          out/ci/venv/bin/python -I scripts/summarize_ctest.py \
            out/ci/ctest-results.xml out/ci/test-summary.md
          cat out/ci/test-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-build-test-results
          path: |
            out/ci/*.log
            out/ci/*.txt
            out/ci/test-summary.md
            out/ci/ctest-results.xml
            out/ci/build/Testing/Temporary/
            out/ci/build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 14
